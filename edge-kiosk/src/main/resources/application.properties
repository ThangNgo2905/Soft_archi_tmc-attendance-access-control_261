spring.application.name=tmc-edge-kiosk
spring.profiles.default=demo
server.address=${EDGE_BIND_ADDRESS:127.0.0.1}
server.port=${EDGE_PORT:8090}
edge.database=${EDGE_DATABASE:data/kiosk.db}
edge.kiosk-id=${KIOSK_ID:BD-IN-01}
edge.factory-id=${FACTORY_ID:BD}
edge.gate-id=${GATE_ID:BD-GATE-01}
edge.direction=${GATE_DIRECTION:IN}
edge.zone=${EDGE_ZONE:Asia/Ho_Chi_Minh}
edge.registry-url=${REGISTRY_URL:http://127.0.0.1:4101}
edge.turnstile-url=${TURNSTILE_URL:http://127.0.0.1:4102}
edge.core-url=${CORE_URL:http://127.0.0.1:4103}
edge.worker-delay=${EDGE_WORKER_DELAY:2000}
edge.workers-enabled=${EDGE_WORKERS_ENABLED:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
