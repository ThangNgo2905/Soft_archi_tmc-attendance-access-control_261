spring.application.name=tmc-aac

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tmc_attendance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tmc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tmc_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

tmc.integration.turnstile.base-url=${TMC_TURNSTILE_BASE_URL:http://localhost:4000}
tmc.integration.hr.base-url=${TMC_HR_BASE_URL:http://localhost:4000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable Boot's docker-compose helper; use root docker-compose.yml instead
spring.docker.compose.enabled=false
