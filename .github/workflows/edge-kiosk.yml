name: Edge Kiosk
on:
  pull_request:
    paths: ['edge-kiosk/**', 'docker-compose.edge.yml', '.github/workflows/edge-kiosk.yml']
  push:
    branches: [main, feat/kiosk-scanner]
    paths: ['edge-kiosk/**', 'docker-compose.edge.yml', '.github/workflows/edge-kiosk.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge-kiosk/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify UI
        working-directory: edge-kiosk/ui
        run: npm ci && npm run lint && npm run build
      - name: Verify Edge and package local UI
        run: bash edge-kiosk/mvnw -B -f edge-kiosk/pom.xml verify
      - name: Verify mock contracts
        run: python -m unittest discover -s edge-kiosk/demo-mocks -v
      - name: Check Compose
        run: docker compose -f docker-compose.edge.yml config --quiet
