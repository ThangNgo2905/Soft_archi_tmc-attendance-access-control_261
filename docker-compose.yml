services:
  postgres:
    image: postgres:16-alpine
    container_name: tmc-postgres
    environment:
      POSTGRES_USER: tmc_user
      POSTGRES_PASSWORD: tmc_password
      POSTGRES_DB: tmc_attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmc_user -d tmc_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tmc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-servers:
    build:
      context: ./mock-servers
    image: tmc-aac-mock:local
    container_name: tmc-mock-servers
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    image: tmc-aac-backend:local
    container_name: tmc-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tmc_attendance
      SPRING_DATASOURCE_USERNAME: tmc_user
      SPRING_DATASOURCE_PASSWORD: tmc_password
      TMC_TURNSTILE_BASE_URL: http://mock-servers:4000
      TMC_HR_BASE_URL: http://mock-servers:4000
    depends_on:
      postgres:
        condition: service_healthy
      mock-servers:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    image: tmc-aac-frontend:local
    container_name: tmc-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
